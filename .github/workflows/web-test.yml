# 前端自动化测试 CI：typecheck + 单测（Vitest）
#
# 设计：
#   - 独立于 cross-build.yml（前端改动只跑前端测试，不触发 Rust 全量编译）
#   - npm ci + actions/cache 缓存 node_modules，快速
#   - typecheck（tsc --noEmit）+ vitest run（单测）两步，任一失败即红
name: web-test

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web-test.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web-test.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test
