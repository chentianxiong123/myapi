# 前端自动化测试 CI：typecheck + 单测（Vitest）
#
# 设计：
#   - 独立于 cross-build.yml（前端改动只跑前端测试，不触发 Rust 全量编译）
#   - npm ci + actions/cache 缓存 node_modules，快速
#   - typecheck（tsc --noEmit）+ vitest run（单测）两步，任一失败即红
name: web-test

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web-test.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web-test.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

  # ---------------- E2E（Playwright，桌面 + iPhone 14 移动端） ----------------
  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Install browsers (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run e2e
        run: npm run e2e

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
