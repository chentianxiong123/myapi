[package]
name = "myapi"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
glob = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1"

[dev-dependencies]
# HTTP 集成测试：axum oneshot 要 tower ServiceExt + http-body-util 读 body
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# 测试用临时目录（隔离 gateway.yaml / SQLite 写，不污染真实配置）
tempfile = "3"
# 网关转发真测：起本地 mock 上游 HTTP 服务器（学 LiteLLM gateway-forward）
wiremock = "0.6"

[profile.release]
# 分发形态：体积/内存优先（opt-level z + 单 codegen + 去 unwinding 表）
strip = true
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
debug = false
